    <path d="M23 49h76m-76 46h63m-63 12h49" fill="none" stroke="#a6b7ca" stroke-width="1.5" stroke-linecap="round"/>
    <path class="pa-latex-cursor" d="M16 42v15" stroke="#d9ba85" stroke-width="2"/>
    <path d="M202 49h57" stroke="#ecf2fa" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M202 86h74m-74 12h74m-74 12h54" fill="none" stroke="#a6b7ca" stroke-width="1.4" stroke-linecap="round"/>
