<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210" role="img" aria-labelledby="title description">
      <title id="title">8086 Step Lab</title>
      <desc id="description">8086 Step Lab，汇编教学实验；AX 为 8000h 的十六位表示，OF 为 1、CF 为 0。 动画关闭后，所有内容仍可读。</desc>
      <style>
      :root{--canvas:#0d1421;--surface:#121d2e;--line:#283b54;--ink:#ecf2fa;--muted:#a6b7ca;--ice:#88bfff;--copper:#d9ba85}
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif}
      .mono{font-family:Consolas,'Cascadia Code','SFMono-Regular',monospace}
      .wire{fill:none;stroke:var(--line);stroke-width:1.8}
      .flow{fill:none;stroke:var(--ice);stroke-width:1.5;stroke-dasharray:4 8;opacity:.65;animation:flow 4.8s linear infinite}
      .scanner{animation:package-scan 4.8s ease-in-out infinite}
      .text-scanner{animation:text-scan 4.8s ease-in-out infinite}
      .evidence-dot{animation:glow 4.8s ease-in-out infinite}
      .delayed{animation-delay:1.2s}.late{animation-delay:2.4s}
      .diff-before{animation:before 4.8s ease-in-out infinite}.diff-after{animation:after 4.8s ease-in-out infinite}
      .bit-glow{animation:glow 4.8s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-48}}
      @keyframes package-scan{0%,100%{transform:translateY(-12px)}50%{transform:translateY(12px)}}
      @keyframes text-scan{0%,100%{transform:translateX(0)}50%{transform:translateX(100px)}}
      @keyframes glow{0%,100%{opacity:.65}45%,65%{opacity:1}}
      @keyframes before{0%,100%{opacity:1}40%,70%{opacity:.5}}
      @keyframes after{0%,100%{opacity:.6}40%,70%{opacity:1}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flow{stroke-dasharray:none}.bit-glow,.evidence-dot,.diff-before,.diff-after{opacity:1}}
    </style>
      <rect x=".5" y=".5" width="479" height="209" rx="18" fill="var(--surface)" stroke="var(--line)"/>
      <text x="24" y="42" font-size="26" font-weight="650" fill="var(--ink)">8086 Step Lab</text><text x="24" y="77" font-size="20" font-weight="400" fill="var(--ink)">8086 指令单步执行与状态观察</text><text x="24" y="104" font-size="18" font-weight="400" fill="var(--muted)">JavaScript · Registers / Flags</text><rect x="20" y="120" width="440" height="74" rx="10" fill="var(--canvas)"/><g transform="translate(25 120)"><text x="13" y="27" font-size="22" font-weight="400" fill="var(--ice)" class="mono">AX 8000h</text><text x="13" y="59" font-size="18" font-weight="400" fill="var(--muted)" class="mono">OF 1 · CF 0</text><rect x="161" y="19" width="11" height="28" rx="2" fill="var(--ice)" stroke="var(--ice)" class="bit-glow"/><rect x="176" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="191" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="206" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="221" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="236" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="251" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="266" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="281" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="296" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="311" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="326" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="341" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="356" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="371" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/><rect x="386" y="19" width="11" height="28" rx="2" fill="var(--surface)" stroke="var(--line)" class=""/></g><path d="M435 25h14v14m-14 0 14-14" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
    </svg>