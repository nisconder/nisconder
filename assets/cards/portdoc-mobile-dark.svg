<title id="title">portdoc</title>
<desc id="description">nisconder/portdoc：Compare localhost, IPv4 and IPv6 across Windows and WSL. Identify listening projects and Docker Compose services.。自有项目 · nisconder。。JavaScript · Star 4 · Fork 0。代码更新 2026-11-07。图形为功能示意，不是实时执行结果。</desc>
<style>:root{--canvas:#0d1421;--surface:#121d2e;--line:#283b54;--ink:#ecf2fa;--muted:#a6b7ca;--ice:#88bfff;--copper:#d9ba85}
