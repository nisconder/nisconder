<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="164" viewBox="0 0 1100 164" role="img" aria-labelledby="title description">
      <title id="title">8086 Step Lab</title>
      <desc id="description">8086 Step Lab，汇编教学实验；AX 为 8000h 的十六位表示，OF 为 1、CF 为 0。 动画关闭后，所有内容仍可读。</desc>
      <style>
      :root{--canvas:#f7f9fc;--surface:#ffffff;--line:#d6e0eb;--ink:#1b2d46;--muted:#526985;--ice:#2674bc;--copper:#a26f25}
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif}
      .mono{font-family:Consolas,'Cascadia Code','SFMono-Regular',monospace}
      .wire{fill:none;stroke:var(--line);stroke-width:1.8}
      .flow{fill:none;stroke:var(--ice);stroke-width:1.5;stroke-dasharray:4 8;opacity:.65;animation:flow 4.8s linear infinite}
      .scanner{animation:package-scan 4.8s ease-in-out infinite}
      .text-scanner{animation:text-scan 4.8s ease-in-out infinite}
      .evidence-dot{animation:glow 4.8s ease-in-out infinite}
      .delayed{animation-delay:1.2s}.late{animation-delay:2.4s}
      .diff-before{animation:before 4.8s ease-in-out infinite}.diff-after{animation:after 4.8s ease-in-out infinite}
      .bit-glow{animation:glow 4.8s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-48}}
      @keyframes package-scan{0%,100%{transform:translateY(-12px)}50%{transform:translateY(12px)}}
      @keyframes text-scan{0%,100%{transform:translateX(0)}50%{transform:translateX(100px)}}
      @keyframes glow{0%,100%{opacity:.65}45%,65%{opacity:1}}
      @keyframes before{0%,100%{opacity:1}40%,70%{opacity:.5}}
      @keyframes after{0%,100%{opacity:.6}40%,70%{opacity:1}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flow{stroke-dasharray:none}.bit-glow,.evidence-dot,.diff-before,.diff-after{opacity:1}}
    </style>
      <rect x=".5" y=".5" width="1099" height="163" rx="18" fill="var(--surface)" stroke="var(--line)"/>
      <g transform="translate(0 0.0)"><text x="34" y="52" font-size="32" font-weight="650" fill="var(--ink)">8086 Step Lab</text><text x="34" y="92" font-size="22" font-weight="400" fill="var(--ink)">8086 指令单步执行与状态观察</text><text x="34" y="133" font-size="18" font-weight="400" fill="var(--muted)">JavaScript · Registers / Flags</text><path d="M1050 27h17v17m-17 0 17-17" fill="none" stroke="var(--muted)" stroke-width="1.6"/><g transform="translate(736 20)"><text x="5" y="31" font-size="22" font-weight="400" fill="var(--muted)" class="mono">AX</text><text x="5" y="72" font-size="36" font-weight="600" fill="var(--ice)" class="mono">8000</text><text x="138" y="65" font-size="22" font-weight="400" fill="var(--muted)" class="mono">OF 1 · CF 0</text><rect x="6" y="94" width="14" height="20" rx="2" fill="var(--ice)" stroke="var(--ice)" class="bit-glow"/><rect x="25" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="44" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="63" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="82" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="101" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="120" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="139" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="158" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="177" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="196" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="215" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="234" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="253" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="272" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/><rect x="291" y="94" width="14" height="20" rx="2" fill="var(--canvas)" stroke="var(--line)" class=""/></g></g>
    </svg>