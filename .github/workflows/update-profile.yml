name: Update profile SVGs

on:
  schedule:
    # 00:17, 06:17, 12:17, 18:17 UTC; avoid the busiest minute of each hour.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'test/**'
      - 'data/project-display.json'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-svg-update
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'nisconder/nisconder'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROFILE_USER: nisconder
      PROFILE_BRANCH: main
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Fetch public GitHub data
        run: python scripts/fetch_github_data.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Render SVGs and refresh README links
        run: python scripts/update_profile.py
      - name: Check data and generated assets
        run: python -m unittest discover -s test
      - name: Commit changed profile assets
        shell: bash
        run: |
          set -euo pipefail
          git add -- README.md assets data/contributions.json data/github-profile.json
          if git diff --cached --quiet; then
            echo "Public profile data and SVGs are already current."
            exit 0
          fi
          git fetch origin "$PROFILE_BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$PROFILE_BRANCH")" ]; then
            echo "The branch changed during rendering. Rerun the workflow against its latest commit."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public profile SVG data'
          git push origin "HEAD:$PROFILE_BRANCH"
